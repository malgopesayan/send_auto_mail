<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Pipeline Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #0B0D10;
    --panel: #14181D;
    --panel-border: #262B31;
    --text-primary: #E8E6DF;
    --text-muted: #8B9099;
    --accent-amber: #FFB100;
    --accent-amber-dim: #C98A00;
    --status-high: #4FD1C5;
    --status-medium: #FFB100;
    --status-low: #6B7280;
    --status-review: #F97066;
    --status-sent: #34D399;
    --status-not-sent: #8B9099;
    --status-fail: #F97066;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-void);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255,177,0,0.05), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(79,209,197,0.04), transparent 40%);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid var(--panel-border);
    flex-wrap: wrap;
    gap: 12px;
  }

  header.top h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin: 0;
    color: var(--text-primary);
  }

  header.top .subtitle {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 2px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--status-low);
  }
  .status-dot.running {
    background: var(--accent-amber);
    box-shadow: 0 0 8px var(--accent-amber);
    animation: pulse 1.2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .status-dot.running { animation: none; }
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 28px 96px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-chip {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-chip .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .stat-chip .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 700;
  }

  section.panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    margin-bottom: 24px;
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--panel-border);
  }
  .panel-header h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0;
  }

  button.primary {
    background: var(--accent-amber);
    color: #1a1300;
    border: none;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 9px 16px;
    border-radius: 7px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  button.primary:hover { background: #ffc233; }
  button.primary:active { transform: scale(0.97); }
  button.primary:disabled {
    background: #4a4230;
    color: #8a8270;
    cursor: not-allowed;
  }

  button.ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--panel-border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  button.ghost:hover { color: var(--text-primary); border-color: var(--text-muted); }

  #console {
    height: 260px;
    overflow-y: auto;
    padding: 14px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.6;
    background: #0D1013;
  }
  #console .line { white-space: pre-wrap; word-break: break-word; }
  #console .line.success { color: var(--status-sent); }
  #console .line.fail { color: var(--status-fail); }
  #console .line.warn { color: var(--accent-amber); }
  #console .line.muted { color: var(--text-muted); }
  #console .cursor::after {
    content: '▌';
    color: var(--accent-amber);
    animation: pulse 1s infinite;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  thead th {
    text-align: left;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 10px 16px;
    border-bottom: 1px solid var(--panel-border);
  }
  tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-border);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid currentColor;
  }
  .badge.high { color: var(--status-high); }
  .badge.medium { color: var(--status-medium); }
  .badge.low { color: var(--status-low); }
  .badge.review { color: var(--status-review); }
  .badge.sent { color: var(--status-sent); }
  .badge.notsent { color: var(--status-not-sent); }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
  }

  /* Chat dock */
  #chat-toggle {
    position: fixed;
    bottom: 22px;
    right: 22px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--accent-amber);
    color: #1a1300;
    border: none;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    z-index: 50;
  }

  #chat-panel {
    position: fixed;
    bottom: 88px;
    right: 22px;
    width: 340px;
    max-width: calc(100vw - 32px);
    height: 440px;
    max-height: calc(100vh - 140px);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 50;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #chat-panel.open { display: flex; }

  #chat-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    max-width: 85%;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent-amber);
    color: #1a1300;
  }
  .msg.bot {
    align-self: flex-start;
    background: #1D2229;
    color: var(--text-primary);
    border: 1px solid var(--panel-border);
  }
  .msg.thinking { color: var(--text-muted); font-style: italic; }

  #chat-input-row {
    display: flex;
    border-top: 1px solid var(--panel-border);
  }
  #chat-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-primary);
    padding: 12px 14px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  #chat-input:focus { outline: none; }
  #chat-send {
    background: none;
    border: none;
    color: var(--accent-amber);
    font-weight: 700;
    padding: 0 16px;
    cursor: pointer;
  }
  #chat-send:disabled { color: var(--text-muted); cursor: not-allowed; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>JOB PIPELINE CONSOLE</h1>
    <div class="subtitle">Sayan Malgope — screenshot → extraction → outreach</div>
  </div>
  <div class="status-pill">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">IDLE</span>
  </div>
</header>

<main>
  <div class="stats-row" id="stats-row">
    <div class="stat-chip"><div class="label">Total Jobs</div><div class="value" id="stat-total">—</div></div>
    <div class="stat-chip"><div class="label">High Priority</div><div class="value" id="stat-high">—</div></div>
    <div class="stat-chip"><div class="label">Sent</div><div class="value" id="stat-sent">—</div></div>
    <div class="stat-chip"><div class="label">Pending</div><div class="value" id="stat-pending">—</div></div>
  </div>

  <section class="panel">
    <div class="panel-header">
      <h2>Add Screenshots</h2>
      <span id="upload-count" style="font-size:12px; color:var(--text-muted);"></span>
    </div>
    <div style="padding: 18px;">
      <label for="file-input" id="drop-zone" style="
        display:flex; align-items:center; justify-content:center; flex-direction:column;
        gap:6px; border:1.5px dashed var(--panel-border); border-radius:10px;
        padding:26px; cursor:pointer; color:var(--text-muted); font-size:13px; text-align:center;">
        <span style="font-family:'JetBrains Mono', monospace; color: var(--text-primary); font-size:13px;">Click to choose screenshots, or drag them here</span>
        <span>PNG / JPG / WEBP — multiple files OK</span>
      </label>
      <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" multiple style="display:none;" />
      <div style="display:flex; justify-content:flex-end; margin-top:12px;">
        <button class="primary" id="upload-btn" disabled>Upload</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Pipeline Console</h2>
      <button class="primary" id="run-btn">Run Pipeline</button>
    </div>
    <div id="console">
      <div class="line muted">Waiting to run. Click "Run Pipeline" to process new screenshots from Supabase Storage.</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Jobs</h2>
      <button class="ghost" id="refresh-btn">Refresh</button>
    </div>
    <div id="jobs-table-wrap">
      <div class="empty-state">Loading jobs…</div>
    </div>
  </section>
</main>

<button id="chat-toggle" title="Open assistant">💬</button>
<div id="chat-panel">
  <div id="chat-header">Pipeline Assistant</div>
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="e.g. send mail to TestCo" />
    <button id="chat-send">Send</button>
  </div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);

let jobsCache = [];
let chatHistory = []; // [{role, content}]

function badgeClassForPriority(priority) {
  if (!priority) return 'notsent';
  const p = priority.toLowerCase();
  if (p.startsWith('review')) return 'review';
  if (p === 'high') return 'high';
  if (p === 'medium') return 'medium';
  if (p === 'low') return 'low';
  return 'notsent';
}

function badgeClassForStatus(status) {
  return status === 'Sent' ? 'sent' : 'notsent';
}

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderStats(jobs) {
  const total = jobs.length;
  const high = jobs.filter(j => (j.priority || '').toLowerCase() === 'high').length;
  const sent = jobs.filter(j => j.email_status === 'Sent').length;
  const pending = total - sent;
  $('#stat-total').textContent = total;
  $('#stat-high').textContent = high;
  $('#stat-sent').textContent = sent;
  $('#stat-pending').textContent = pending;
}

function renderJobsTable(jobs) {
  const wrap = $('#jobs-table-wrap');
  if (!jobs.length) {
    wrap.innerHTML = '<div class="empty-state">No jobs yet. Run the pipeline to extract some from your screenshots.</div>';
    return;
  }

  const rows = jobs.map(j => `
    <tr>
      <td>${escapeHtml(j.company) || '—'}</td>
      <td>${escapeHtml(j.job_title) || '—'}</td>
      <td>${escapeHtml(j.location) || '—'}</td>
      <td>${escapeHtml(j.recruiter_name) || '—'}<br><span style="color:var(--text-muted); font-size:12px;">${escapeHtml(j.recruiter_email) || ''}</span></td>
      <td class="mono">${j.job_match_score ?? 0}</td>
      <td><span class="badge ${badgeClassForPriority(j.priority)}">${escapeHtml(j.priority) || '—'}</span></td>
      <td><span class="badge ${badgeClassForStatus(j.email_status)}">${escapeHtml(j.email_status) || 'Not Sent'}</span></td>
      <td>
        ${j.email_status === 'Sent'
          ? '<span style="color:var(--text-muted); font-size:12px;">Sent</span>'
          : `<button class="ghost" onclick="sendJob(${j.id})">Send</button>`}
      </td>
    </tr>
  `).join('');

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Company</th><th>Title</th><th>Location</th><th>Recruiter</th>
          <th>Score</th><th>Priority</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function loadJobs() {
  try {
    const res = await fetch('/api/jobs');
    jobsCache = await res.json();
    renderStats(jobsCache);
    renderJobsTable(jobsCache);
  } catch (err) {
    $('#jobs-table-wrap').innerHTML = `<div class="empty-state">Couldn't load jobs: ${escapeHtml(err.message)}</div>`;
  }
}

async function sendJob(id) {
  const res = await fetch(`/api/jobs/${id}/send`, { method: 'POST' });
  const data = await res.json();
  appendConsoleLine(data.message || data.detail || 'Done.', res.ok ? 'success' : 'fail');
  loadJobs();
}

function appendConsoleLine(text, cls) {
  const el = document.createElement('div');
  el.className = 'line' + (cls ? ' ' + cls : '');
  el.textContent = text;
  const consoleEl = $('#console');
  consoleEl.appendChild(el);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

function setRunning(running) {
  $('#run-btn').disabled = running;
  $('#status-dot').classList.toggle('running', running);
  $('#status-text').textContent = running ? 'RUNNING' : 'IDLE';
}

async function runPipeline() {
  setRunning(true);
  $('#console').innerHTML = '';
  appendConsoleLine('Starting pipeline...', 'muted');

  const startRes = await fetch('/api/process/start', { method: 'POST' });
  const startData = await startRes.json();
  if (startData.status === 'already_running') {
    appendConsoleLine('Pipeline is already running.', 'warn');
  }

  const evtSource = new EventSource('/api/process/stream');
  evtSource.onmessage = (event) => {
    const item = JSON.parse(event.data);
    if (item.type === 'start') {
      appendConsoleLine(`Found ${item.total} screenshot(s) to process.`, 'muted');
    } else if (item.type === 'log') {
      const cls = item.message.includes('❌') ? 'fail' : item.message.includes('⚠️') ? 'warn' : 'muted';
      appendConsoleLine(item.message, cls);
    } else if (item.type === 'progress') {
      if (item.status === 'success') {
        // row already logged via the accompanying 'log' message
        loadJobs();
      } else if (item.status === 'review') {
        loadJobs();
      }
    } else if (item.type === 'done') {
      appendConsoleLine(`Finished — ${item.succeeded} succeeded, ${item.failed} failed.`, 'muted');
      setRunning(false);
      loadJobs();
      evtSource.close();
    }
  };
  evtSource.onerror = () => {
    evtSource.close();
    setRunning(false);
  };
}

$('#run-btn').addEventListener('click', runPipeline);
$('#refresh-btn').addEventListener('click', loadJobs);

// --- Upload ---
let pendingFiles = [];

function updatePendingLabel() {
  $('#upload-count').textContent = pendingFiles.length
    ? `${pendingFiles.length} file(s) selected`
    : '';
  $('#upload-btn').disabled = pendingFiles.length === 0;
}

function addPendingFiles(fileList) {
  const allowed = ['image/png', 'image/jpeg', 'image/webp'];
  for (const f of fileList) {
    if (allowed.includes(f.type)) pendingFiles.push(f);
  }
  updatePendingLabel();
}

$('#file-input').addEventListener('change', (e) => {
  addPendingFiles(e.target.files);
});

const dropZone = $('#drop-zone');
['dragover', 'dragenter'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropZone.style.borderColor = 'var(--accent-amber)';
  });
});
['dragleave', 'drop'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropZone.style.borderColor = 'var(--panel-border)';
  });
});
dropZone.addEventListener('drop', (e) => {
  if (e.dataTransfer.files) addPendingFiles(e.dataTransfer.files);
});

$('#upload-btn').addEventListener('click', async () => {
  if (!pendingFiles.length) return;
  $('#upload-btn').disabled = true;
  $('#upload-btn').textContent = 'Uploading...';

  const formData = new FormData();
  pendingFiles.forEach(f => formData.append('files', f));

  try {
    const res = await fetch('/api/screenshots/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.uploaded && data.uploaded.length) {
      appendConsoleLine(`Uploaded ${data.uploaded.length} screenshot(s) to the bucket: ${data.uploaded.join(', ')}`, 'success');
    }
    if (data.skipped && data.skipped.length) {
      appendConsoleLine(`Skipped (not an image): ${data.skipped.join(', ')}`, 'warn');
    }
    if (data.errors && data.errors.length) {
      data.errors.forEach(e => appendConsoleLine(`❌ ${e.name}: ${e.error}`, 'fail'));
    }
  } catch (err) {
    appendConsoleLine(`Upload failed: ${err.message}`, 'fail');
  } finally {
    pendingFiles = [];
    $('#file-input').value = '';
    $('#upload-btn').textContent = 'Upload';
    updatePendingLabel();
  }
});

// --- Chat ---
$('#chat-toggle').addEventListener('click', () => {
  $('#chat-panel').classList.toggle('open');
});

function appendChatMessage(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  el.textContent = text;
  $('#chat-messages').appendChild(el);
  $('#chat-messages').scrollTop = $('#chat-messages').scrollHeight;
  return el;
}

async function sendChatMessage() {
  const input = $('#chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  $('#chat-send').disabled = true;

  appendChatMessage('user', text);
  const thinkingEl = appendChatMessage('bot', 'Thinking...');
  thinkingEl.classList.add('thinking');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: chatHistory.slice(-10) }),
    });
    const data = await res.json();
    thinkingEl.remove();
    appendChatMessage('bot', data.reply || data.detail || 'Something went wrong.');
    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: data.reply || '' });
    loadJobs(); // in case the chatbot sent mail or started processing
  } catch (err) {
    thinkingEl.remove();
    appendChatMessage('bot', `Error: ${err.message}`);
  } finally {
    $('#chat-send').disabled = false;
  }
}

$('#chat-send').addEventListener('click', sendChatMessage);
$('#chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChatMessage();
});

loadJobs();
</script>
</body>
</html>
